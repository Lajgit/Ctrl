plugins {
    alias(libs.plugins.android.application)
}

def appVersionName = "1.2.0"
def appVersionCode = 4

android {
    namespace 'com.gouzhu'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.gouzhu"
        minSdk 33
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("GouzhuApp_V${appVersionName}.apk")
        }
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // 服务端设备 SDK：只引入 standalone，禁止与瘦 JAR 同时加入。
    implementation files('libs/pinball-device-sdk-client-0.1.0-SNAPSHOT-standalone.jar')

    // SDK 不替代 MQTT 厂商库；当前仍使用 Paho 连接服务端返回的 Broker/Topic。
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // APK/控制板升级下载模块仍使用 OkHttp。
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // App 现有本地业务持久化仍使用 Gson；SDK 内部 Gson 已重定位，不会冲突。
    implementation 'com.google.code.gson:gson:2.10.1'

    // 服务端返回二维码原始字符串后在本机生成付款二维码。
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
