plugins {
    alias(libs.plugins.android.application)
}

def appVersionName = "2.3.2"
def appVersionCode = 20

android {
    namespace 'com.gouzhu'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.gouzhu"
        minSdk 33
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            // 新版 MQTT JAR 与宿主 Paho 都携带根目录 bundle.properties；仅保留一份。
            pickFirsts += ['bundle.properties']
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("GouzhuApp_V${appVersionName}.apk")
        }
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    implementation files('libs/xiaoda-device-sdk-0.1.0.jar')
    implementation files('libs/xiaoda-device-mqtt-0.1.0.jar')
    implementation files('libs/xiaoda-device-hardware-0.1.0.jar')

    // 现有传输层暂时使用宿主 Paho；业务命令、结果和硬件映射均使用新版 SDK。
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
