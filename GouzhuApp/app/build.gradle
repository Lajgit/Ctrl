plugins {
    alias(libs.plugins.android.application)
}

def appVersionName = "1.2.2"
def appVersionCode = 6

android {
    namespace 'com.gouzhu'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.gouzhu"
        minSdk 33
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("GouzhuApp_V${appVersionName}.apk")
        }
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    implementation files('libs/xiaoda-device-sdk-0.1.0.jar')
    implementation files('libs/xiaoda-device-mqtt-0.1.0.jar')
    implementation files('libs/xiaoda-device-hardware-0.1.0.jar')

    // 现有 MqttManager 暂时继续使用宿主 Paho；新版 MQTT JAR 内部 Paho 已重定位。
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
