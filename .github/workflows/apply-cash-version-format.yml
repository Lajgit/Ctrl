name: Apply cash configuration version formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/cash-config-version-floor-format-20260803
      - name: Preserve existing Java indentation style
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java")
          text = path.read_text(encoding="utf-8")

          old_first = '''    public synchronized int getLatestCashConfigVersion() {
                  return Math.max(
                          getCashConfigVersion(),
                          Math.max(
                          parsePositiveInt(getMeta(META_LATEST_CONFIG_VERSION)),
                          parsePositiveInt(getMeta(META_PENDING_CONFIG_VERSION))
                  )
                  );
              }
          '''
          new_first = '''    public synchronized int getLatestCashConfigVersion() {
                  return Math.max(
                          getCashConfigVersion(),
                          Math.max(
                                  parsePositiveInt(getMeta(META_LATEST_CONFIG_VERSION)),
                                  parsePositiveInt(getMeta(META_PENDING_CONFIG_VERSION))
                          )
                  );
              }
          '''

          old_second = '''            int latestVersion = Math.max(
                          getCashConfigVersion(db),
                          Math.max(
                          parsePositiveInt(
                                  getMeta(db, META_LATEST_CONFIG_VERSION)
                          ),
                          parsePositiveInt(
                                  getMeta(db, META_PENDING_CONFIG_VERSION)
                          )
                  )
                  );
          '''
          new_second = '''            int latestVersion = Math.max(
                          getCashConfigVersion(db),
                          Math.max(
                                  parsePositiveInt(
                                          getMeta(db, META_LATEST_CONFIG_VERSION)
                                  ),
                                  parsePositiveInt(
                                          getMeta(db, META_PENDING_CONFIG_VERSION)
                                  )
                          )
                  );
          '''

          for old, new in ((old_first, new_first), (old_second, new_second)):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Commit formatting fix
        run: |
          git rm .github/workflows/apply-cash-version-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          git commit -m "保持现金配置版本代码缩进风格"
          git push origin HEAD:style/cash-config-version-floor-format-20260803