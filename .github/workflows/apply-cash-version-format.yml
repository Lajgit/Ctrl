name: Apply cash configuration transaction formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/cash-config-version-floor-format-20260803
      - name: Fix transaction block indentation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java")
          text = path.read_text(encoding="utf-8")
          pending_start = text.index(
              "    public synchronized boolean savePendingCashConfiguration("
          )
          block_start = text.index(
              "            int latestVersion = Math.max(",
              pending_start
          )
          block_end = text.index(
              "            if (configVersion <= latestVersion)",
              block_start
          )
          block = (
              "            int latestVersion = Math.max(\n"
              "                    getCashConfigVersion(db),\n"
              "                    Math.max(\n"
              "                            parsePositiveInt(\n"
              "                                    getMeta(db, META_LATEST_CONFIG_VERSION)\n"
              "                            ),\n"
              "                            parsePositiveInt(\n"
              "                                    getMeta(db, META_PENDING_CONFIG_VERSION)\n"
              "                            )\n"
              "                    )\n"
              "            );\n"
          )
          text = text[:block_start] + block + text[block_end:]
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Commit formatting fix
        run: |
          git rm .github/workflows/apply-cash-version-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          git commit -m "修正现金配置事务块缩进"
          git push origin HEAD:style/cash-config-version-floor-format-20260803