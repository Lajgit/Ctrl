name: Temporary Internal Redemption Build
on:
  pull_request:
    branches:
      - tmp-internal-redemption-build-ci-base-20260824
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 应用并审查官方券码核销实现
        run: |
          if grep -q 'def appVersionName = "2.3.21"' GouzhuApp/app/build.gradle; then
            python3 tools/apply_internal_redemption_patch.py
          fi
          python3 - <<'PY'
          from pathlib import Path

          p = Path('GouzhuApp/app/src/main/java/com/gouzhu/scanner/ReverseScannerManager.java')
          s = p.read_text(encoding='utf-8')
          old = ' * 其他业务码仍交给 {@link ScannerBusinessRouter}，按 bootstrap 的 redemptionRouting 匹配。</p>'
          new = ' * 会员取珠、官方券码和第三方团购均要求先选择显式入口，再把扫码原文交给对应业务状态机。</p>'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandManager.java')
          s = p.read_text(encoding='utf-8')
          if 'import com.gouzhu.redemption.InternalRedemptionManager;' not in s:
              old = 'import com.gouzhu.payment.PaymentManager;\nimport com.gouzhu.redemption.MemberWithdrawalManager;'
              new = 'import com.gouzhu.payment.PaymentManager;\nimport com.gouzhu.redemption.InternalRedemptionManager;\nimport com.gouzhu.redemption.MemberWithdrawalManager;'
              if old not in s:
                  raise SystemExit('DeviceCommandManager import anchor missing')
              s = s.replace(old, new, 1)
          if 'InternalRedemptionManager.get(context).resumePending();' not in s:
              old = '        MemberWithdrawalManager.get(context).resumePending();\n        ThirdPartyRedemptionManager.get(context).resumePending();'
              new = '        MemberWithdrawalManager.get(context).resumePending();\n        InternalRedemptionManager.get(context).resumePending();\n        ThirdPartyRedemptionManager.get(context).resumePending();'
              if old not in s:
                  raise SystemExit('DeviceCommandManager recovery anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add GouzhuApp/app/build.gradle \
            GouzhuApp/app/src/main/AndroidManifest.xml \
            GouzhuApp/app/src/main/java/com/gouzhu/MainActivity.java \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandManager.java \
            GouzhuApp/app/src/main/java/com/gouzhu/sdk/DeviceSdkManager.java \
            GouzhuApp/app/src/main/java/com/gouzhu/redemption/RedemptionCapabilityResolver.java \
            GouzhuApp/app/src/main/java/com/gouzhu/redemption/InternalRedemptionPolicy.java \
            GouzhuApp/app/src/main/java/com/gouzhu/redemption/InternalRedemptionStore.java \
            GouzhuApp/app/src/main/java/com/gouzhu/redemption/InternalRedemptionManager.java \
            GouzhuApp/app/src/main/java/com/gouzhu/redemption/InternalRedemptionActivity.java \
            GouzhuApp/app/src/main/java/com/gouzhu/scanner/ReverseScannerManager.java \
            GouzhuApp/app/src/main/java/com/gouzhu/transaction/TransactionOccupancyManager.java \
            GouzhuApp/app/src/main/java/com/gouzhu/transaction/TransactionOccupancyPolicy.java \
            GouzhuApp/app/src/main/res/layout/activity_main.xml \
            GouzhuApp/app/src/main/res/layout/activity_internal_redemption.xml \
            GouzhuApp/app/src/main/res/values/redemption_strings.xml \
            GouzhuApp/app/src/test/java/com/gouzhu/redemption/InternalRedemptionPolicyTest.java \
            GouzhuApp/app/src/test/java/com/gouzhu/transaction/TransactionOccupancyPolicyTest.java
          if ! git diff --cached --quiet; then
            git commit -m '临时应用并审查官方小程序券码核销实现'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: 隐私和旧自动路由检查
        run: |
          ! grep -E "Log\..*(rawCode|pickupCode|scannedCode|sensitiveCode)" GouzhuApp/app/src/main/java/com/gouzhu/redemption/InternalRedemptionManager.java
          ! grep -R "ScannerBusinessRouter.get" GouzhuApp/app/src/main/java/com/gouzhu/scanner/ReverseScannerManager.java
      - name: 单元测试和调试构建
        run: |
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug
