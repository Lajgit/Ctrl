name: Temporary Logo Resource Fix

on:
  pull_request:
    branches:
      - tmp-logo-resource-fix-ci-base-20260824

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 核对PNG资源完整性和尺寸
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          expected = {
              Path('GouzhuApp/app/src/main/res/drawable-nodpi/ic_logo_douyin.png'): (384, 160),
              Path('GouzhuApp/app/src/main/res/drawable-nodpi/ic_internal_redemption_brand.png'): (420, 420),
          }
          for path, size in expected.items():
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', (path, 'PNG签名错误')
              assert data[12:16] == b'IHDR', (path, '缺少IHDR')
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == size, (path, (width, height), size)
              assert len(data) > 1000, (path, '文件异常过小')
              print(path, width, height, len(data))
          assert not Path('GouzhuApp/app/src/main/res/drawable-nodpi/ic_logo_douyin.webp').exists()
          assert not Path('GouzhuApp/app/src/main/res/drawable-nodpi/ic_internal_redemption_brand.webp').exists()
          PY
      - name: 单元测试和调试构建
        run: |
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug
