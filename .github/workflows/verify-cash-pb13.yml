name: Verify PB13 cash configuration changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Android debug APK
        working-directory: GouzhuApp
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

  firmware-static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PB13 mapping and cash state invariants
        run: |
          python3 <<'PY'
          from pathlib import Path

          checks = {
              "Control/Core/Inc/main.h": [
                  "#define CoinPower_Pin GPIO_PIN_13",
                  "#define CoinPower_GPIO_Port GPIOB",
              ],
              "Control/Core/Src/gpio.c": [
                  "HAL_GPIO_WritePin(CoinPower_GPIO_Port, CoinPower_Pin, GPIO_PIN_RESET)",
                  "SPI2_CS_Pin|SPI2_OE_Pin|CoinPower_Pin",
              ],
              "Control/Control.ioc": [
                  "PB13.Signal=GPIO_Output",
                  "PB13.PinState=GPIO_PIN_RESET",
              ],
              "Control/Task/src/KeyTask.c": [
                  "CashAcceptance_CommitPendingIfMatched",
                  "BillRequestedEnable",
                  "CoinAcceptor_SetEnableInternal(false)",
              ],
              "GouzhuApp/app/src/main/java/com/gouzhu/hardware/SerialCashConfigurationAdapter.java": [
                  "private static final int COIN_MASK = 2;",
                  "active.expectedMask = mask & 0xFF;",
              ],
              "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java": [
                  "savePendingCashConfiguration",
                  "commitPendingCashConfiguration",
              ],
              "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java": [
                  "CASH_CONFIGURATION_STALE",
                  "discardInterruptedCashConfiguration",
              ],
          }

          for path, required in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for value in required:
                  if value not in text:
                      raise SystemExit(f"{path}: missing {value}")

          adapter = Path(
              "GouzhuApp/app/src/main/java/com/gouzhu/hardware/"
              "SerialCashConfigurationAdapter.java"
          ).read_text(encoding="utf-8")
          if "ALWAYS_ON_COIN_MASK" in adapter:
              raise SystemExit("coin always-on logic still exists")

          spi = Path("Control/Core/Src/spi.c").read_text(encoding="utf-8")
          if "GPIO_InitStruct.Pin = GPIO_PIN_13|GPIO_PIN_15" in spi:
              raise SystemExit("PB13 is still configured as SPI2 alternate function")
          PY
          git diff --check origin/main...HEAD