name: SDK API Dump
on:
  push:
    paths:
      - '.github/workflows/sdk-api-dump.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dump APIs
        shell: bash
        run: |
          mkdir -p docs
          OUT=docs/sdk-api-dump.txt
          : > "$OUT"
          for jar in GouzhuApp/app/libs/xiaoda-device-*.jar; do
            echo "=== JAR $jar ===" >> "$OUT"
            jar tf "$jar" | grep '\.class$' | sort >> "$OUT"
          done
          CP='GouzhuApp/app/libs/xiaoda-device-sdk-0.1.0.jar:GouzhuApp/app/libs/xiaoda-device-mqtt-0.1.0.jar:GouzhuApp/app/libs/xiaoda-device-hardware-0.1.0.jar'
          classes=(
            com.pinball.xiaoda.device.sdk.hardware.MarbleHardwareAdapter
            com.pinball.xiaoda.device.sdk.hardware.CashConfigurationAdapter
            com.pinball.xiaoda.device.sdk.hardware.DeviceHardwareCommandMapper
            com.pinball.xiaoda.device.sdk.hardware.DispenseRequest
            com.pinball.xiaoda.device.sdk.hardware.CollectRequest
            com.pinball.xiaoda.device.sdk.hardware.HardwareExecutionResult
            com.pinball.xiaoda.device.sdk.hardware.CashConfigurationResult
            com.pinball.xiaoda.device.sdk.hardware.CashTier
            com.pinball.xiaoda.device.sdk.client.MqttSessionManager
            com.pinball.xiaoda.device.sdk.client.PendingMessageStore
            com.pinball.xiaoda.device.sdk.client.PendingOutboundMessage
            com.pinball.xiaoda.device.sdk.client.MqttSessionListener
            com.pinball.xiaoda.device.sdk.protocol.DeviceMqttCommandCodec
            com.pinball.xiaoda.device.sdk.protocol.DeviceCommandResultCodec
            com.pinball.xiaoda.device.sdk.protocol.DeviceCommandResult
            'com.pinball.xiaoda.device.sdk.protocol.DeviceCommandResult$Builder'
            com.pinball.xiaoda.device.sdk.protocol.DeviceMqttCommand
            com.pinball.xiaoda.device.sdk.protocol.DeviceMqttCommandTypes
            com.pinball.xiaoda.device.sdk.protocol.DispenseMarblesCommandData
            com.pinball.xiaoda.device.sdk.protocol.CollectMarblesCommandData
            com.pinball.xiaoda.device.sdk.protocol.CashConfigurationCommandData
            'com.pinball.xiaoda.device.sdk.protocol.CashConfigurationCommandData$CashSaleItem'
            com.pinball.xiaoda.device.sdk.protocol.CashEventResponseCommandData
            com.pinball.xiaoda.device.sdk.protocol.CommandResultAcknowledgement
            com.pinball.xiaoda.device.sdk.core.MqttReceiptKey
          )
          for c in "${classes[@]}"; do
            echo "=== JAVAP $c ===" >> "$OUT"
            javap -classpath "$CP" -public "$c" >> "$OUT" 2>&1 || true
          done
      - name: Commit dump
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/sdk-api-dump.txt
          git commit -m '生成新版SDK接口清单' || exit 0
          git push
