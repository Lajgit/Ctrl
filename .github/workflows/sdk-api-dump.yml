name: Unified Purchase Physical State Audit
on:
  push:
    paths:
      - '.github/workflows/sdk-api-dump.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch
        run: python3 tools/tmp_unified_payment_patch.py > unified-patch.log 2>&1
      - name: Build and test
        run: |
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug > ../unified-payment-build.log 2>&1
      - name: Report and commit
        run: |
          mkdir -p docs
          {
            echo 'status=0'
            echo "source_commit=$(git rev-parse HEAD)"
            echo "auth_log_scan=$(grep -R -n -E 'Log\.[a-zA-Z]+\([^\n]*authCode|authCode[^\n]*Log\.' GouzhuApp/app/src/main/java/com/gouzhu 2>/dev/null | wc -l)"
            echo '--- patch ---'
            cat unified-patch.log
            echo '--- build tail ---'
            tail -n 250 unified-payment-build.log
          } > docs/unified-payment-build-status.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add \
            GouzhuApp/app/src/main/java/com/gouzhu/payment/PaymentManager.java \
            GouzhuApp/app/src/main/java/com/gouzhu/transaction/TransactionOccupancyManager.java \
            GouzhuApp/app/src/main/java/com/gouzhu/transaction/TransactionOccupancyPolicy.java \
            GouzhuApp/app/src/test/java/com/gouzhu/transaction/TransactionOccupancyPolicyTest.java \
            docs/unified-payment-build-status.txt
          git commit -m '保持统一支付物理阶段直到服务端终态'
          git push
