name: Fix SDK Success
on:
  push:
    paths:
      - '.github/workflows/fix-sdk-success.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java')
          text = path.read_text(encoding='utf-8')
          if '.isSuccess()' not in text:
              raise SystemExit('target not found')
          path.write_text(text.replace('.isSuccess()', '.isSuccessful()'), encoding='utf-8')
          PY
      - name: Build
        run: |
          set +e
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug > ../v2-build.log 2>&1
          rc=$?
          cd ..
          mkdir -p docs
          {
            echo "status=$rc"
            echo "source_commit=$(git rev-parse HEAD)"
            echo '--- build tail ---'
            tail -n 300 v2-build.log
          } > docs/v2-build-status.txt
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java docs/v2-build-status.txt
          git commit -m '修正HardwareExecutionResult方法并记录构建结果' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
