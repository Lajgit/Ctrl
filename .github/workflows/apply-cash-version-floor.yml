name: Apply cash configuration version floor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-config-version-floor-20260803
      - name: Persist highest accepted configuration version
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          store = "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java"
          replace_once(
              store,
              "    private static final String META_PENDING_CONFIG = \"pending_cash_config_message\";\n",
              "    private static final String META_PENDING_CONFIG = \"pending_cash_config_message\";\n"
              "    private static final String META_LATEST_CONFIG_VERSION = \"latest_cash_config_version\";\n"
          )
          replace_once(
              store,
              "        parsePositiveInt(getMeta(META_PENDING_CONFIG_VERSION))\n",
              "        Math.max(\n"
              "                parsePositiveInt(getMeta(META_LATEST_CONFIG_VERSION)),\n"
              "                parsePositiveInt(getMeta(META_PENDING_CONFIG_VERSION))\n"
              "        )\n"
          )
          replace_once(
              store,
              "            parsePositiveInt(getMeta(db, META_PENDING_CONFIG_VERSION))\n",
              "            Math.max(\n"
              "                    parsePositiveInt(\n"
              "                            getMeta(db, META_LATEST_CONFIG_VERSION)\n"
              "                    ),\n"
              "                    parsePositiveInt(\n"
              "                            getMeta(db, META_PENDING_CONFIG_VERSION)\n"
              "                    )\n"
              "            )\n"
          )
          replace_once(
              store,
              "            putMeta(db, META_PENDING_CONFIG_VERSION, String.valueOf(configVersion));\n",
              "            putMeta(db, META_LATEST_CONFIG_VERSION, String.valueOf(configVersion));\n"
              "            putMeta(db, META_PENDING_CONFIG_VERSION, String.valueOf(configVersion));\n"
          )

          runtime = "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java"
          replace_once(
              runtime,
              "        cashAdapter.start();\n"
              "        SerialManager.get(context).sendCommand(CMD_VERSION, 0L, false);\n",
              "        cashAdapter.start();\n"
              "        cashAdapter.markApplied(store.getCashConfigVersion());\n"
              "        SerialManager.get(context).sendCommand(CMD_VERSION, 0L, false);\n"
          )
          PY
          git diff --check
      - name: Commit focused fix
        run: |
          git rm .github/workflows/apply-cash-version-floor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
          git commit -m "持久化现金配置最高已接收版本"
          git push origin HEAD:fix/cash-config-version-floor-20260803