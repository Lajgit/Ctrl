name: 验证反扫动态路由构建
on:
  push:
    paths:
      - '.github/workflows/verify-reverse-scanner-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 构建Android应用
        shell: bash
        run: |
          set +e
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug > ../reverse-scanner-build.log 2>&1
          rc=$?
          cd ..
          mkdir -p docs
          {
            echo "android_build_status=$rc"
            echo "source_commit=$(git rev-parse HEAD)"
            echo '--- build tail ---'
            tail -n 400 reverse-scanner-build.log
          } > docs/反扫动态路由构建结果.txt
          exit 0
      - name: 提交构建结果
        shell: bash
        run: |
          rm -f .github/workflows/verify-reverse-scanner-build.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m '记录反扫动态路由编译验证结果' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
