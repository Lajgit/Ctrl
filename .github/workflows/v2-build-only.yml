name: V2 Build Only
on:
  push:
    paths:
      - '.github/workflows/v2-build-only.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          set +e
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug > ../v2-build-only.log 2>&1
          rc=$?
          cd ..
          mkdir -p docs
          {
            echo "status=$rc"
            echo "source_commit=$(git rev-parse HEAD)"
            echo '--- build tail ---'
            tail -n 300 v2-build-only.log
          } > docs/v2-build-only-status.txt
          exit 0
      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/v2-build-only-status.txt
          git commit -m '记录平台统一出珠V2构建结果' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
