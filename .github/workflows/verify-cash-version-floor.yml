name: Verify cash configuration version floor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Android debug APK
        working-directory: GouzhuApp
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

  version-floor-static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version floor persistence
        run: |
          python3 <<'PY'
          from pathlib import Path

          store = Path(
              "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java"
          ).read_text(encoding="utf-8")
          runtime = Path(
              "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java"
          ).read_text(encoding="utf-8")

          required_store = [
              'META_LATEST_CONFIG_VERSION = "latest_cash_config_version"',
              'getMeta(META_LATEST_CONFIG_VERSION)',
              'getMeta(db, META_LATEST_CONFIG_VERSION)',
              'putMeta(db, META_LATEST_CONFIG_VERSION, String.valueOf(configVersion))',
          ]
          for value in required_store:
              if value not in store:
                  raise SystemExit(f"DeviceCommandStore missing: {value}")

          if 'deleteMeta(db, META_LATEST_CONFIG_VERSION)' in store:
              raise SystemExit("highest accepted version must not be cleared with pending data")

          required_runtime = (
              'cashAdapter.markApplied(store.getCashConfigVersion());'
          )
          if required_runtime not in runtime:
              raise SystemExit("runtime does not restore applied version before safe disable")
          PY
          git diff --check origin/main...HEAD