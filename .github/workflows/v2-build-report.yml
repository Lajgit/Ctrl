name: V2.1 Build Report
on:
  push:
    paths:
      - '.github/workflows/v2-build-report.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android V2.1
        shell: bash
        run: |
          set +e
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug > ../build-v2-report.log 2>&1
          rc=$?
          cd ..
          mkdir -p docs
          {
            echo "android_build_status=$rc"
            echo "source_commit=$(git rev-parse HEAD)"
            echo '--- log tail ---'
            tail -n 400 build-v2-report.log
            echo '--- control static references ---'
            grep -R -n -E 'PendingCashAmountFen|PendingCashSequence|PendingCashMedium|HARDWARE_FLAG_PENDING_CASH' Control || true
          } > docs/v2-build-report.txt
          exit 0
      - name: Commit report
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/v2-build-report.txt
          git commit -m '记录App V2.1连续现金累计编译结果' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
