name: Temporary Redemption Build
on:
  push:
    paths:
      - '.github/workflows/tmp-redemption-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 应用第二轮核销审查修正
        run: |
          python3 tools/tmp_review_fix.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add GouzhuApp
          git commit -m '临时修正团购核销审查问题' || true
          git push origin HEAD:tmp-third-party-redemption-20260824
      - name: 静态安全检查
        shell: bash
        run: |
          set -e
          test ! -e GouzhuApp/app/src/main/java/com/gouzhu/scanner/ScannerBusinessRouter.java
          ! grep -R "createThirdPartyRedemptionFromRoutedCode" GouzhuApp/app/src/main/java
          ! grep -R "voucherCodePrefix" GouzhuApp/app/src/main/java
          grep -R "prepareThirdPartyRedemptionForSelectedChannel" GouzhuApp/app/src/main/java/com/gouzhu/redemption GouzhuApp/app/src/main/java/com/gouzhu/sdk
          grep -R "confirmThirdPartyRedemption" GouzhuApp/app/src/main/java/com/gouzhu/redemption GouzhuApp/app/src/main/java/com/gouzhu/sdk
          grep -R "queryThirdPartyRedemption" GouzhuApp/app/src/main/java/com/gouzhu/redemption GouzhuApp/app/src/main/java/com/gouzhu/sdk
      - name: 构建和单元测试
        shell: bash
        run: |
          set +e
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug > ../tmp-redemption-build.log 2>&1
          rc=$?
          cd ..
          mkdir -p docs
          {
            echo "status=$rc"
            echo "source_commit=$(git rev-parse HEAD)"
            echo '--- build tail ---'
            tail -n 400 tmp-redemption-build.log
          } > docs/tmp-redemption-build-status.txt
          exit 0
      - name: 保存构建报告
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/tmp-redemption-build-status.txt
          git commit -m '记录核销功能第二轮构建结果' || true
          git push origin HEAD:tmp-third-party-redemption-20260824
