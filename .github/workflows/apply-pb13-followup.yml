name: Apply PB13 compile follow-up

on:
  push:
    branches:
      - fix/cash-config-pb13-20260803

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-config-pb13-20260803
      - name: Fix Java overload ambiguity
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java")
          text = path.read_text(encoding="utf-8")
          old = "        clearPendingCashConfiguration(null);"
          new = "        clearPendingCashConfiguration((String) null);"
          if text.count(old) != 1:
              raise SystemExit(f"expected one match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Commit follow-up
        run: |
          git rm .github/workflows/apply-pb13-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          git commit -m "修复现金配置清理方法重载歧义"
          git push origin HEAD:fix/cash-config-pb13-20260803
