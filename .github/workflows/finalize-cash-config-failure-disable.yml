name: Finalize cash configuration failure disable

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-config-receipt-increment-20260803
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Persist failed cash disable state
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one match, found {count}: {old!r}'
                  )
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          store = 'GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java'
          replace_once(
              store,
              '            if (!saveCommandEnvelope(db, envelope, "received")) {\n',
              '            if (!saveCommandEnvelope(db, envelope, "pending")) {\n'
          )
          replace_once(
              store,
              '''            clearPendingCashConfiguration(db);
                  db.setTransactionSuccessful();
                  return true;
              } finally {
          ''',
              '''            putMeta(db, META_CASH_BLOCKED, "0");
                  clearPendingCashConfiguration(db);
                  db.setTransactionSuccessful();
                  return true;
              } finally {
          '''
          )
          replace_once(
              store,
              '''            if (!saveCommandEnvelope(db, envelope, "failed")) {
                      return false;
                  }
                  String receiptKey = sourceMessageId + "|" + eventNo + "|"
          ''',
              '''            if (!saveCommandEnvelope(db, envelope, "failed")) {
                      return false;
                  }
                  putMeta(db, META_CASH_BLOCKED, "1");
                  String receiptKey = sourceMessageId + "|" + eventNo + "|"
          '''
          )
          replace_once(
              store,
              '''            if (!updateCommandState(db, messageId, "failed")) {
                      return null;
                  }
                  String receiptKey = messageId + "|" + eventNo + "|"
          ''',
              '''            if (!updateCommandState(db, messageId, "failed")) {
                      return null;
                  }
                  putMeta(db, META_CASH_BLOCKED, "1");
                  String receiptKey = messageId + "|" + eventNo + "|"
          '''
          )

          runtime = 'GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java'
          replace_once(
              runtime,
              '''    private void reapplyCashConfiguration() {
                  DeviceCommandStore.CashConfigurationRecord record =
          ''',
              '''    private void reapplyCashConfiguration() {
                  if (store.isCashBlocked()) {
                      cashAdapter.disableCashAcceptance();
                      return;
                  }
                  DeviceCommandStore.CashConfigurationRecord record =
          '''
          )
          PY
          git diff --check
      - name: Build Android debug APK
        working-directory: GouzhuApp
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Verify failure remains disabled
        run: |
          set -euo pipefail
          grep -F 'saveCommandEnvelope(db, envelope, "pending")' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          test "$(grep -c 'putMeta(db, META_CASH_BLOCKED, "1")' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java)" -eq 2
          grep -F 'putMeta(db, META_CASH_BLOCKED, "0")' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          grep -F 'if (store.isCashBlocked()) {' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
          git diff --check
      - name: Commit focused follow-up
        run: |
          git rm .github/workflows/finalize-cash-config-failure-disable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
          git commit -m "保持现金配置失败后的禁用状态"
          git push origin HEAD:fix/cash-config-receipt-increment-20260803
