name: Retry cash configuration receipt increment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-config-receipt-increment-20260803
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply focused source changes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def java_block(source, spaces):
              return indent(dedent(source).strip("\n"), " " * spaces) + "\n\n"

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one match, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(path, start, end, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker missing: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker missing: {end!r}")
              file.write_text(
                  text[:start_index] + new + text[end_index:],
                  encoding="utf-8"
              )

          decoder = "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/SdkCommandDecoder.java"
          replace_between(
              decoder,
              "        public EncodedResult acknowledgement(",
              "        public EncodedResult physicalTerminal(",
              java_block('''
              public EncodedResult acknowledgement(String eventNo, long nowMillis) {
                  return encode(DeviceCommandResult.acknowledgement(
                          sdkCommand,
                          eventNo,
                          nowMillis
                  ));
              }

              public EncodedResult configurationAcknowledgement(
                      String eventNo,
                      long nowMillis
              ) {
                  return encode(DeviceCommandResult.configurationAcknowledgement(
                          sdkCommand,
                          eventNo,
                          nowMillis
                  ));
              }
              ''', 8)
          )
          replace_between(
              decoder,
              "        public EncodedResult configurationTerminal(",
              "        public EncodedResult genericTerminal(",
              java_block('''
              public EncodedResult configurationTerminal(
                      String eventNo,
                      boolean success,
                      String resultCode,
                      String resultMessage,
                      long nowMillis
              ) {
                  return encode(DeviceCommandResult.configurationTerminal(
                          sdkCommand,
                          eventNo,
                          success,
                          resultCode,
                          resultMessage,
                          nowMillis
                  ));
              }
              ''', 8)
          )

          store = "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java"
          replace_once(
              store,
              '    private static final String META_PENDING_CONFIG_SNAPSHOT = '
              '"pending_cash_config_snapshot";\n',
              '    private static final String META_PENDING_CONFIG_SNAPSHOT = '
              '"pending_cash_config_snapshot";\n'
              '    private static final String META_PENDING_CONFIG_FAILURE_EVENT_NO =\n'
              '            "pending_cash_config_failure_event_no";\n'
              '    private static final String META_PENDING_CONFIG_FAILURE_STATUS =\n'
              '            "pending_cash_config_failure_status";\n'
              '    private static final String META_PENDING_CONFIG_FAILURE_PAYLOAD =\n'
              '            "pending_cash_config_failure_payload";\n'
          )
          replace_between(
              store,
              "    public synchronized boolean savePendingCashConfiguration(",
              "    public synchronized boolean commitPendingCashConfiguration(",
              java_block('''
              public synchronized boolean savePendingCashConfiguration(
                      JSONObject envelope,
                      int configVersion,
                      boolean enabled,
                      boolean changeEnabled,
                      String snapshotJson,
                      String ackEventNo,
                      String ackResultStatus,
                      String ackPayload,
                      String interruptedEventNo,
                      String interruptedResultStatus,
                      String interruptedPayload
              ) {
                  if (envelope == null || configVersion <= 0 || blank(snapshotJson)
                          || blank(ackEventNo) || blank(ackResultStatus) || blank(ackPayload)
                          || blank(interruptedEventNo)
                          || blank(interruptedResultStatus)
                          || blank(interruptedPayload)) {
                      return false;
                  }
                  String messageId = envelope.optString("messageId", "").trim();
                  if (messageId.isEmpty()) {
                      return false;
                  }

                  SQLiteDatabase db = getWritableDatabase();
                  db.beginTransaction();
                  try {
                      int latestVersion = Math.max(
                              getCashConfigVersion(db),
                              Math.max(
                                      parsePositiveInt(
                                              getMeta(db, META_LATEST_CONFIG_VERSION)
                                      ),
                                      parsePositiveInt(
                                              getMeta(db, META_PENDING_CONFIG_VERSION)
                                      )
                              )
                      );
                      if (configVersion <= latestVersion) {
                          return false;
                      }
                      if (!saveCommandEnvelope(db, envelope, "received")) {
                          return false;
                      }

                      putMeta(db, META_PENDING_CONFIG, messageId);
                      putMeta(db, META_LATEST_CONFIG_VERSION, String.valueOf(configVersion));
                      putMeta(db, META_PENDING_CONFIG_VERSION, String.valueOf(configVersion));
                      putMeta(db, META_PENDING_CONFIG_ENABLED, enabled ? "1" : "0");
                      putMeta(db, META_PENDING_CONFIG_CHANGE, changeEnabled ? "1" : "0");
                      putMeta(db, META_PENDING_CONFIG_SNAPSHOT, snapshotJson);
                      putMeta(db, META_PENDING_CONFIG_FAILURE_EVENT_NO, interruptedEventNo);
                      putMeta(
                              db,
                              META_PENDING_CONFIG_FAILURE_STATUS,
                              interruptedResultStatus
                      );
                      putMeta(
                              db,
                              META_PENDING_CONFIG_FAILURE_PAYLOAD,
                              interruptedPayload
                      );

                      String receiptKey = messageId + "|" + ackEventNo + "|"
                              + ackResultStatus;
                      if (!saveOutbox(
                              db,
                              receiptKey,
                              "command_result",
                              messageId,
                              ackEventNo,
                              ackResultStatus,
                              ackPayload
                      )) {
                          return false;
                      }
                      db.setTransactionSuccessful();
                      return true;
                  } finally {
                      db.endTransaction();
                  }
              }
              ''', 4)
          )
          replace_between(
              store,
              "    public synchronized boolean commitPendingCashConfiguration(",
              "    public synchronized void clearPendingCashConfiguration(",
              java_block('''
              public synchronized boolean commitPendingCashConfigurationAndResult(
                      String messageId,
                      String eventNo,
                      String resultStatus,
                      String payload
              ) {
                  if (blank(messageId) || blank(eventNo) || blank(payload)
                          || !"success".equals(resultStatus)) {
                      return false;
                  }
                  SQLiteDatabase db = getWritableDatabase();
                  db.beginTransaction();
                  try {
                      if (!messageId.equals(getMeta(db, META_PENDING_CONFIG))) {
                          return false;
                      }
                      int version = parsePositiveInt(
                              getMeta(db, META_PENDING_CONFIG_VERSION));
                      String snapshot = getMeta(db, META_PENDING_CONFIG_SNAPSHOT);
                      if (version <= 0 || blank(snapshot)) {
                          return false;
                      }

                      ContentValues values = new ContentValues();
                      values.put("id", 1);
                      values.put("config_version", version);
                      values.put(
                              "enabled",
                              "1".equals(getMeta(db, META_PENDING_CONFIG_ENABLED)) ? 1 : 0
                      );
                      values.put(
                              "change_enabled",
                              "1".equals(getMeta(db, META_PENDING_CONFIG_CHANGE)) ? 1 : 0
                      );
                      values.put("snapshot_json", snapshot);
                      values.put("updated_at", System.currentTimeMillis());
                      if (db.insertWithOnConflict(
                              "cash_configuration",
                              null,
                              values,
                              SQLiteDatabase.CONFLICT_REPLACE
                      ) == -1L) {
                          return false;
                      }
                      if (!updateCommandState(db, messageId, "applied")) {
                          return false;
                      }
                      String receiptKey = messageId + "|" + eventNo + "|"
                              + resultStatus;
                      if (!saveOutbox(
                              db,
                              receiptKey,
                              "command_result",
                              messageId,
                              eventNo,
                              resultStatus,
                              payload
                      )) {
                          return false;
                      }

                      clearPendingCashConfiguration(db);
                      db.setTransactionSuccessful();
                      return true;
                  } finally {
                      db.endTransaction();
                  }
              }

              public synchronized boolean failCashConfigurationAndResult(
                      JSONObject envelope,
                      String sourceMessageId,
                      String eventNo,
                      String resultStatus,
                      String payload,
                      boolean clearPending
              ) {
                  if (envelope == null || blank(sourceMessageId) || blank(eventNo)
                          || blank(payload) || !"failed".equals(resultStatus)
                          || !sourceMessageId.equals(
                                  envelope.optString("messageId", "").trim())) {
                      return false;
                  }

                  SQLiteDatabase db = getWritableDatabase();
                  db.beginTransaction();
                  try {
                      if (!saveCommandEnvelope(db, envelope, "failed")) {
                          return false;
                      }
                      String receiptKey = sourceMessageId + "|" + eventNo + "|"
                              + resultStatus;
                      if (!saveOutbox(
                              db,
                              receiptKey,
                              "command_result",
                              sourceMessageId,
                              eventNo,
                              resultStatus,
                              payload
                      )) {
                          return false;
                      }
                      if (clearPending
                              && sourceMessageId.equals(
                                      getMeta(db, META_PENDING_CONFIG))) {
                          clearPendingCashConfiguration(db);
                      }
                      db.setTransactionSuccessful();
                      return true;
                  } finally {
                      db.endTransaction();
                  }
              }

              public synchronized OutboxItem failInterruptedCashConfiguration() {
                  SQLiteDatabase db = getWritableDatabase();
                  OutboxItem result = null;
                  db.beginTransaction();
                  try {
                      String messageId = getMeta(db, META_PENDING_CONFIG);
                      String eventNo = getMeta(
                              db,
                              META_PENDING_CONFIG_FAILURE_EVENT_NO
                      );
                      String resultStatus = getMeta(
                              db,
                              META_PENDING_CONFIG_FAILURE_STATUS
                      );
                      String payload = getMeta(
                              db,
                              META_PENDING_CONFIG_FAILURE_PAYLOAD
                      );
                      if (blank(messageId) || blank(eventNo) || blank(payload)
                              || !"failed".equals(resultStatus)) {
                          return null;
                      }
                      if (!updateCommandState(db, messageId, "failed")) {
                          return null;
                      }
                      String receiptKey = messageId + "|" + eventNo + "|"
                              + resultStatus;
                      if (!saveOutbox(
                              db,
                              receiptKey,
                              "command_result",
                              messageId,
                              eventNo,
                              resultStatus,
                              payload
                      )) {
                          return null;
                      }

                      clearPendingCashConfiguration(db);
                      result = new OutboxItem();
                      result.receiptKey = receiptKey;
                      result.kind = "command_result";
                      result.sourceMessageId = messageId;
                      result.eventNo = eventNo;
                      result.resultStatus = resultStatus;
                      result.payload = payload;
                      db.setTransactionSuccessful();
                  } finally {
                      db.endTransaction();
                  }
                  return result;
              }
              ''', 4)
          )
          replace_between(
              store,
              "    private boolean saveOutbox(",
              "    private boolean hasOutbox(",
              java_block('''
              private boolean saveOutbox(
                      String receiptKey,
                      String kind,
                      String sourceMessageId,
                      String eventNo,
                      String resultStatus,
                      String payload
              ) {
                  return saveOutbox(
                          getWritableDatabase(),
                          receiptKey,
                          kind,
                          sourceMessageId,
                          eventNo,
                          resultStatus,
                          payload
                  );
              }

              private static boolean saveOutbox(
                      SQLiteDatabase db,
                      String receiptKey,
                      String kind,
                      String sourceMessageId,
                      String eventNo,
                      String resultStatus,
                      String payload
              ) {
                  ContentValues values = new ContentValues();
                  values.put("receipt_key", receiptKey);
                  values.put("kind", kind);
                  values.put("source_message_id", sourceMessageId);
                  values.put("event_no", eventNo);
                  values.put("result_status", resultStatus);
                  values.put("payload", payload);
                  values.put("created_at", System.currentTimeMillis());
                  return db.insertWithOnConflict(
                          "outbox",
                          null,
                          values,
                          SQLiteDatabase.CONFLICT_IGNORE
                  ) != -1L || hasOutbox(db, receiptKey, payload);
              }
              ''', 4)
          )
          replace_between(
              store,
              "    private boolean hasOutbox(",
              "    private List<OutboxItem> listOutbox(",
              java_block('''
              private boolean hasOutbox(String receiptKey) {
                  return hasOutbox(getReadableDatabase(), receiptKey, null);
              }

              private static boolean hasOutbox(
                      SQLiteDatabase db,
                      String receiptKey,
                      String expectedPayload
              ) {
                  try (Cursor cursor = db.query(
                          "outbox",
                          new String[]{"payload"},
                          "receipt_key=?",
                          new String[]{receiptKey},
                          null,
                          null,
                          null)) {
                      if (!cursor.moveToFirst()) {
                          return false;
                      }
                      return expectedPayload == null
                              || expectedPayload.equals(cursor.getString(0));
                  }
              }
              ''', 4)
          )
          replace_once(
              store,
              "    private static int getCashConfigVersion(SQLiteDatabase db) {\n",
              java_block('''
              private static boolean saveCommandEnvelope(
                      SQLiteDatabase db,
                      JSONObject envelope,
                      String state
              ) {
                  if (envelope == null || blank(state)) {
                      return false;
                  }
                  String messageId = envelope.optString("messageId", "").trim();
                  if (messageId.isEmpty()) {
                      return false;
                  }
                  ContentValues values = new ContentValues();
                  values.put("message_id", messageId);
                  values.put("envelope", envelope.toString());
                  values.put("state", state);
                  values.put("updated_at", System.currentTimeMillis());
                  return db.insertWithOnConflict(
                          "commands",
                          null,
                          values,
                          SQLiteDatabase.CONFLICT_REPLACE
                  ) != -1L;
              }

              private static boolean updateCommandState(
                      SQLiteDatabase db,
                      String messageId,
                      String state
              ) {
                  ContentValues values = new ContentValues();
                  values.put("state", state);
                  values.put("updated_at", System.currentTimeMillis());
                  return db.update(
                          "commands",
                          values,
                          "message_id=?",
                          new String[]{messageId}
                  ) == 1;
              }
              ''', 4)
              + "    private static int getCashConfigVersion(SQLiteDatabase db) {\n"
          )
          replace_once(
              store,
              "        deleteMeta(db, META_PENDING_CONFIG_SNAPSHOT);\n",
              "        deleteMeta(db, META_PENDING_CONFIG_SNAPSHOT);\n"
              "        deleteMeta(db, META_PENDING_CONFIG_FAILURE_EVENT_NO);\n"
              "        deleteMeta(db, META_PENDING_CONFIG_FAILURE_STATUS);\n"
              "        deleteMeta(db, META_PENDING_CONFIG_FAILURE_PAYLOAD);\n"
          )

          runtime = "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java"
          replace_between(
              runtime,
              "    private void acceptCashConfiguration(",
              "    private String validateCashConfiguration(",
              java_block('''
              private void acceptCashConfiguration(SdkCommandDecoder.DecodedCommand decoded) {
                  String messageId = decoded.sdkCommand.getMessageId();
                  final CashConfigurationCommandData config;
                  try {
                      config = decoded.sdkCommand.requireData(
                              CashConfigurationCommandData.class
                      );
                  } catch (Throwable error) {
                      cashAdapter.disableCashAcceptance();
                      persistAndPublishConfigurationFailure(
                              decoded,
                              "CASH_CONFIGURATION_INVALID",
                              messageOf(error),
                              false
                      );
                      return;
                  }

                  String validationError = validateCashConfiguration(config);
                  if (validationError != null) {
                      cashAdapter.disableCashAcceptance();
                      persistAndPublishConfigurationFailure(
                              decoded,
                              "CASH_CONFIGURATION_INVALID",
                              validationError,
                              false
                      );
                      return;
                  }

                  long configVersion = config.getConfigVersion();
                  if (configVersion <= store.getLatestCashConfigVersion()) {
                      cashAdapter.disableCashAcceptance();
                      persistAndPublishConfigurationFailure(
                              decoded,
                              "CASH_CONFIGURATION_STALE",
                              "configVersion必须高于本地已接收版本",
                              false
                      );
                      return;
                  }

                  boolean enabled = config.isCashAcceptanceEnabled();
                  List<CashTier> tiers = toCashTiers(config);
                  final SdkCommandDecoder.EncodedResult acknowledgement;
                  final SdkCommandDecoder.EncodedResult interruptedTerminal;
                  try {
                      long nowMillis = System.currentTimeMillis();
                      acknowledgement = decoded.configurationAcknowledgement(
                              messageId + "-ack",
                              nowMillis
                      );
                      interruptedTerminal = decoded.configurationTerminal(
                              messageId + "-result",
                              false,
                              "CASH_CONFIGURATION_INTERRUPTED",
                              "现金配置处理被进程重启中断",
                              nowMillis
                      );
                  } catch (Throwable error) {
                      cashAdapter.disableCashAcceptance();
                      reportStorageFault(
                              "现金配置专用回执生成失败：" + messageOf(error));
                      return;
                  }

                  if (!store.savePendingCashConfiguration(
                          decoded.envelope,
                          (int) configVersion,
                          enabled,
                          config.isChangeEnabled(),
                          decoded.envelope.toString(),
                          acknowledgement.eventNo,
                          acknowledgement.resultStatus,
                          acknowledgement.payload,
                          interruptedTerminal.eventNo,
                          interruptedTerminal.resultStatus,
                          interruptedTerminal.payload
                  )) {
                      cashAdapter.disableCashAcceptance();
                      persistAndPublishConfigurationFailure(
                              decoded,
                              "LOCAL_STORAGE_ERROR",
                              "完整现金配置、ACK和中断终态无法原子保存",
                              false
                      );
                      return;
                  }

                  liveCommands.put(messageId, decoded);
                  MqttManager.get(context).reportCommandResult(acknowledgement.payload);
                  hardwareExecutor.execute(() -> {
                      try {
                          CashConfigurationResult result = enabled
                                  ? cashAdapter.apply(configVersion, tiers)
                                  : cashAdapter.applyDisabled(configVersion);
                          if (result != null && result.isApplied()) {
                              final SdkCommandDecoder.EncodedResult successTerminal;
                              try {
                                  successTerminal = decoded.configurationTerminal(
                                          messageId + "-result",
                                          true,
                                          "CASH_CONFIGURATION_APPLIED",
                                          "现金配置已应用",
                                          System.currentTimeMillis()
                                  );
                              } catch (Throwable error) {
                                  cashAdapter.disableCashAcceptance();
                                  persistAndPublishConfigurationFailure(
                                          decoded,
                                          "LOCAL_STORAGE_ERROR",
                                          "现金配置成功回执生成失败：" + messageOf(error),
                                          true
                                  );
                                  return;
                              }

                              if (store.commitPendingCashConfigurationAndResult(
                                      messageId,
                                      successTerminal.eventNo,
                                      successTerminal.resultStatus,
                                      successTerminal.payload
                              )) {
                                  cashAdapter.markApplied(configVersion);
                                  MqttManager.get(context).reportCommandResult(
                                          successTerminal.payload
                                  );
                              } else {
                                  cashAdapter.disableCashAcceptance();
                                  persistAndPublishConfigurationFailure(
                                          decoded,
                                          "LOCAL_STORAGE_ERROR",
                                          "控制板已应用，但本地applied与success回执原子提交失败",
                                          true
                                  );
                              }
                          } else {
                              cashAdapter.disableCashAcceptance();
                              persistAndPublishConfigurationFailure(
                                      decoded,
                                      "CASH_CONFIGURATION_APPLY_FAILED",
                                      result == null
                                              ? "现金配置适配器未返回结果"
                                              : safe(result.getMessage()),
                                      true
                              );
                          }
                      } finally {
                          liveCommands.remove(messageId);
                      }
                  });
              }
              ''', 4)
          )
          replace_between(
              runtime,
              "    private void handleCommandResultAcknowledgement(",
              "    private void handleRedemptionResponse(",
              java_block('''
              private void handleCommandResultAcknowledgement(
                      SdkCommandDecoder.DecodedCommand decoded
              ) {
                  CommandResultAcknowledgement acknowledgement =
                          decoded.sdkCommand.requireData(CommandResultAcknowledgement.class);
                  if (!acknowledgement.isRecorded()) {
                      for (DeviceCommandStore.OutboxItem item
                              : store.listCommandResults()) {
                          if (safe(acknowledgement.getSourceMessageId()).equals(
                                  item.sourceMessageId)
                                  && safe(acknowledgement.getEventNo()).equals(
                                          item.eventNo)
                                  && safe(acknowledgement.getResultStatus()).equals(
                                          item.resultStatus)) {
                              MqttManager.get(context).reportCommandResult(item.payload);
                          }
                      }
                      return;
                  }
                  store.removeCommandResult(
                          acknowledgement.getSourceMessageId(),
                          acknowledgement.getEventNo(),
                          acknowledgement.getResultStatus()
                  );
              }
              ''', 4)
          )
          replace_between(
              runtime,
              "    private boolean publishSdkConfigurationTerminal(",
              "    private boolean publishSdkGenericTerminal(",
              java_block('''
              private boolean persistAndPublishConfigurationFailure(
                      SdkCommandDecoder.DecodedCommand decoded,
                      String resultCode,
                      String resultMessage,
                      boolean clearPending
              ) {
                  try {
                      String messageId = decoded.sdkCommand.getMessageId();
                      SdkCommandDecoder.EncodedResult terminal =
                              decoded.configurationTerminal(
                                      messageId + "-result",
                                      false,
                                      resultCode,
                                      safe(resultMessage),
                                      System.currentTimeMillis()
                              );
                      if (!store.failCashConfigurationAndResult(
                              decoded.envelope,
                              terminal.sourceMessageId,
                              terminal.eventNo,
                              terminal.resultStatus,
                              terminal.payload,
                              clearPending
                      )) {
                          reportStorageFault(
                                  "现金配置failed终态无法写入SQLite/outbox");
                          return false;
                      }
                      MqttManager.get(context).reportCommandResult(terminal.payload);
                      return true;
                  } catch (Throwable error) {
                      Log.e(TAG, "SDK现金配置失败终态生成失败", error);
                      reportStorageFault(
                              "现金配置失败终态生成失败：" + messageOf(error));
                      return false;
                  }
              }
              ''', 4)
          )
          replace_between(
              runtime,
              "    private void discardInterruptedCashConfiguration(",
              "    private void recoverWithoutRepeatingPhysicalAction(",
              java_block('''
              private void discardInterruptedCashConfiguration() {
                  String messageId = store.getPendingConfigMessageId();
                  if (blank(messageId)) {
                      return;
                  }
                  cashAdapter.disableCashAcceptance();
                  DeviceCommandStore.OutboxItem terminal =
                          store.failInterruptedCashConfiguration();
                  if (terminal == null) {
                      reportStorageFault(
                              "中断现金配置无法标记failed并保存终态；messageId="
                                      + messageId
                      );
                      return;
                  }
                  MqttManager.get(context).reportCommandResult(terminal.payload);
                  MqttManager.get(context).reportFault(
                          "CASH_CONFIGURATION_INTERRUPTED",
                          "检测到进程重启前未完成的现金配置",
                          3,
                          "已保留最近成功版本、关闭现金设备并保存failed终态；messageId="
                                  + messageId
                  );
              }
              ''', 4)
          )
          replace_between(
              runtime,
              "    private static long safeConfigVersion(",
              "    private static JSONObject parseObject(",
              ""
          )
          PY
          git diff --check
      - name: Verify SDK factories
        run: |
          javap -classpath GouzhuApp/app/libs/xiaoda-device-sdk-0.1.0.jar \
            com.pinball.xiaoda.device.sdk.protocol.DeviceCommandResult \
            | grep -E 'configurationAcknowledgement|configurationTerminal'
      - name: Build Android debug APK
        working-directory: GouzhuApp
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Verify focused implementation
        run: |
          set -euo pipefail
          grep -F 'DeviceCommandResult.configurationAcknowledgement(' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/SdkCommandDecoder.java
          grep -F 'DeviceCommandResult.configurationTerminal(' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/SdkCommandDecoder.java
          grep -F 'commitPendingCashConfigurationAndResult(' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          grep -F 'failInterruptedCashConfiguration()' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
