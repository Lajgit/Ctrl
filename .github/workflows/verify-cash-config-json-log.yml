name: 验证现金配置完整JSON日志构建

on:
  push:
    paths:
      - '.github/workflows/verify-cash-config-json-log.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译Android Debug包并记录结果
        shell: bash
        run: |
          set +e
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug > ../cash-config-build.log 2>&1
          status=$?
          cd ..
          {
            echo "android_build_status=${status}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "--- build tail ---"
            tail -n 160 cash-config-build.log
          } > docs/现金配置完整JSON日志构建结果.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/现金配置完整JSON日志构建结果.txt
          git commit -m "记录现金配置完整JSON日志编译结果" || true
          git push
          exit ${status}
