name: 修复反扫噪声和动态路由
on:
  push:
    paths:
      - '.github/workflows/fix-reverse-scanner-routing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 修改反扫代码
        shell: python
        run: |
          from pathlib import Path

          path = Path('GouzhuApp/app/src/main/java/com/gouzhu/scanner/ReverseScannerManager.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import com.gouzhu.payment.PaymentManager;\n', 'import com.gouzhu.mqtt.MqttManager;\n')
          text = text.replace(
              '    public static final String TYPE_MEMBER_WITHDRAWAL = "memberWithdrawal";\n'
              '    public static final String TYPE_UNSUPPORTED = "unsupported";\n',
              '    public static final String TYPE_MEMBER_WITHDRAWAL = "memberWithdrawal";\n'
              '    public static final String TYPE_THIRD_PARTY_REDEMPTION = "thirdPartyRedemption";\n'
              '    public static final String TYPE_UNSUPPORTED = "unsupported";\n'
          )
          text = text.replace(
              '    private static final int MAX_SCAN_BYTES = 2048;\n'
              '    private static final long IDLE_FRAME_DELAY_MS = 180L;\n'
              '    private static final long DUPLICATE_WINDOW_MS = 1500L;\n',
              '    private static final int MAX_SCAN_BYTES = 2048;\n'
              '    private static final int MIN_SCAN_CHARACTERS = 4;\n'
              '    private static final long IDLE_FRAME_DELAY_MS = 180L;\n'
              '    private static final long DUPLICATE_WINDOW_MS = 1500L;\n'
              '    private static final long NOISE_LOG_INTERVAL_MS = 60_000L;\n'
              '    private static final long FAULT_REPORT_INTERVAL_MS = 60_000L;\n'
          )
          text = text.replace(
              '    private volatile String lastScan = "";\n'
              '    private volatile long lastScanAt;\n',
              '    private volatile String lastScanFingerprint = "";\n'
              '    private volatile long lastScanAt;\n'
              '    private volatile long lastNoiseLogAt;\n'
              '    private volatile int ignoredNoiseFrames;\n'
              '    private volatile long lastFaultReportAt;\n'
          )
          text = text.replace(
              '            Log.e(TAG, "打开反扫模块失败", error);\n',
              '            Log.e(TAG, "打开反扫模块失败", error);\n'
              '            reportScannerFault("反扫模块连接失败：" + messageOf(error));\n'
          )
          text = text.replace(
              '                Log.e(TAG, "反扫串口读取失败", error);\n',
              '                Log.e(TAG, "反扫串口读取失败", error);\n'
              '                reportScannerFault("反扫串口读取失败：" + messageOf(error));\n'
          )

          start = text.index('    private void consumeByte(int value) {')
          end = text.index('    private void flushPendingScan() {', start)
          consume = '''    private void consumeByte(int value) {
        // STX 表示新帧开始。若前一帧没有正常结束，直接清空，避免把噪声拼进二维码。
        if (value == 0x02) {
            resetBuffer();
            return;
        }
        // ETX、CR、LF 均作为完整扫码帧结束符。
        if (value == 0x03 || value == '\\r' || value == '\\n') {
            flushPendingScan();
            return;
        }
        // NUL 和其他 ASCII 控制字符属于线路空闲、模块状态字节或噪声，不进入正文。
        if (value == 0x00 || value < 0x20) {
            return;
        }

        boolean overflow = false;
        synchronized (bufferLock) {
            if (scanBuffer.size() >= MAX_SCAN_BYTES) {
                scanBuffer.reset();
                lastByteAt = 0L;
                overflow = true;
            } else {
                scanBuffer.write(value);
                lastByteAt = SystemClock.elapsedRealtime();
            }
        }
        if (overflow) {
            reportScannerFault("反扫数据超过最大长度，已丢弃");
            broadcast(EVENT_ERROR, "反扫数据超过最大长度，已丢弃", "", "");
        }
    }

'''
          text = text[:start] + consume + text[end:]

          start = text.index('    private void handleScan(byte[] payload) {')
          end = text.index('    private void configureSerialDevice() throws Exception {', start)
          handle = '''    private void handleScan(byte[] payload) {
        String content = new String(payload, StandardCharsets.UTF_8)
                .replace("\\u0000", "")
                .trim();
        if (content.isEmpty()) {
            return;
        }

        // 真正的二维码不会只有一个可打印字符。模块空闲状态或串口毛刺形成的短帧静默丢弃，
        // 不进入重复扫码判断，也不按业务二维码上报。
        if (content.length() < MIN_SCAN_CHARACTERS) {
            recordNoiseFrame(content.length());
            return;
        }

        String fingerprint = fingerprint(content);
        long now = SystemClock.elapsedRealtime();
        if (fingerprint.equals(lastScanFingerprint)
                && now - lastScanAt < DUPLICATE_WINDOW_MS) {
            // 只对完整二维码做短时间幂等，不再为模块空闲单字节持续打印Info日志。
            Log.d(TAG, "忽略短时间重复二维码，长度=" + content.length());
            return;
        }
        lastScanFingerprint = fingerprint;
        lastScanAt = now;

        String maskedCode = maskCode(content);
        ScannerBusinessRouter.Submission submission =
                ScannerBusinessRouter.get(context).submit(content);
        if (submission.accepted) {
            broadcast(
                    EVENT_SCAN_ACCEPTED,
                    submission.message + "，码值=" + maskedCode,
                    submission.codeType,
                    maskedCode
            );
            return;
        }
        if (submission.unsupported) {
            broadcast(
                    EVENT_SCAN_UNSUPPORTED,
                    submission.message + "；长度=" + content.length()
                            + "，尾号=" + maskedCode,
                    TYPE_UNSUPPORTED,
                    maskedCode
            );
            return;
        }
        broadcast(
                EVENT_ERROR,
                submission.message,
                "",
                maskedCode
        );
    }

    /** 线路空闲短帧只做低频Debug统计，避免污染正常联调日志。 */
    private void recordNoiseFrame(int length) {
        ignoredNoiseFrames++;
        long now = SystemClock.elapsedRealtime();
        if (now - lastNoiseLogAt < NOISE_LOG_INTERVAL_MS) {
            return;
        }
        Log.d(
                TAG,
                "反扫串口已静默过滤短帧噪声：count=" + ignoredNoiseFrames
                        + "，lastLength=" + length
        );
        ignoredNoiseFrames = 0;
        lastNoiseLogAt = now;
    }

    /** 使用不可逆摘要完成短时间去重，不在内存中长期保留完整业务码。 */
    private static String fingerprint(String content) {
        return content.length() + ":" + Integer.toHexString(content.hashCode());
    }

    /** 串口真正故障按统一设备故障协议上报，普通空闲噪声不作为故障。 */
    private void reportScannerFault(String description) {
        long now = SystemClock.elapsedRealtime();
        if (now - lastFaultReportAt < FAULT_REPORT_INTERVAL_MS) {
            return;
        }
        lastFaultReportAt = now;
        MqttManager.get(context).reportFault(
                "SCANNER_ERROR",
                "扫码器异常",
                2,
                description
        );
    }

'''
          text = text[:start] + handle + text[end:]
          path.write_text(text, encoding='utf-8')

          sdk = Path('GouzhuApp/app/src/main/java/com/gouzhu/sdk/DeviceSdkManager.java')
          text = sdk.read_text(encoding='utf-8')
          text = text.replace('import com.google.gson.Gson;\nimport com.google.gson.GsonBuilder;\n\n', '')
          start = text.find('    private static void logLong(')
          if start >= 0:
              end = text.index('    /** 获取设备屏动态首页', start)
              text = text[:start] + text[end:]
          old = '''                lastBootstrap = result;

                Gson gson = new GsonBuilder()
                        .serializeNulls()
                        .setPrettyPrinting()
                        .create();

                String bootstrapJson = gson.toJson(result);
                logLong(TAG, "bootstrap完整内容：\\n" + bootstrapJson);


                lastBootstrap = result;'''
          new = '''                lastBootstrap = result;
                // SDK模型的toString会对支付链接、Token和长文本做安全脱敏；
                // 禁止再用Gson反射打印原始字段，避免绕过SDK脱敏策略。
                Log.d(TAG, "bootstrap安全摘要=" + String.valueOf(result));'''
          if old not in text:
              raise RuntimeError('未找到bootstrap原始Gson日志代码')
          text = text.replace(old, new, 1)
          sdk.write_text(text, encoding='utf-8')

          gradle = Path('GouzhuApp/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('def appVersionName = "2.1.1"', 'def appVersionName = "2.1.2"')
          text = text.replace('def appVersionCode = 14', 'def appVersionCode = 15')
          gradle.write_text(text, encoding='utf-8')
      - name: 构建Android应用
        shell: bash
        run: |
          set +e
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug > ../reverse-scanner-build.log 2>&1
          rc=$?
          cd ..
          mkdir -p docs
          {
            echo "android_build_status=$rc"
            echo "source_commit=$(git rev-parse HEAD)"
            echo '--- build tail ---'
            tail -n 300 reverse-scanner-build.log
          } > docs/反扫动态路由构建结果.txt
          exit 0
      - name: 提交修改
        shell: bash
        run: |
          rm -f .github/workflows/fix-reverse-scanner-routing.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m '修复反扫空闲噪声并改用服务端动态路由' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
