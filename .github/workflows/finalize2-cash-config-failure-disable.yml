name: Finalize cash configuration failure disable v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-config-receipt-increment-20260803
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Persist failed cash disable state
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected one match, found {count}: {old!r}'
                  )
              return text.replace(old, new, 1)

          def replace_in_section(text, start, end, old, new, label):
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              section = text[start_index:end_index]
              section = replace_one(section, old, new, label)
              return text[:start_index] + section + text[end_index:]

          store_path = Path(
              'GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java'
          )
          store = store_path.read_text(encoding='utf-8')
          store = replace_one(
              store,
              'saveCommandEnvelope(db, envelope, "received")',
              'saveCommandEnvelope(db, envelope, "pending")',
              'pending state'
          )
          store = replace_in_section(
              store,
              '    public synchronized boolean commitPendingCashConfigurationAndResult(',
              '    public synchronized boolean failCashConfigurationAndResult(',
              '            clearPendingCashConfiguration(db);',
              '            putMeta(db, META_CASH_BLOCKED, "0");\n'
              '            clearPendingCashConfiguration(db);',
              'success blocked state'
          )
          store = replace_in_section(
              store,
              '    public synchronized boolean failCashConfigurationAndResult(',
              '    public synchronized OutboxItem failInterruptedCashConfiguration(',
              '            String receiptKey = sourceMessageId + "|" + eventNo + "|"',
              '            putMeta(db, META_CASH_BLOCKED, "1");\n'
              '            String receiptKey = sourceMessageId + "|" + eventNo + "|"',
              'failure blocked state'
          )
          store = replace_in_section(
              store,
              '    public synchronized OutboxItem failInterruptedCashConfiguration(',
              '    public synchronized void clearPendingCashConfiguration(',
              '            String receiptKey = messageId + "|" + eventNo + "|"',
              '            putMeta(db, META_CASH_BLOCKED, "1");\n'
              '            String receiptKey = messageId + "|" + eventNo + "|"',
              'interrupted blocked state'
          )
          store_path.write_text(store, encoding='utf-8')

          runtime_path = Path(
              'GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java'
          )
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = replace_one(
              runtime,
              '    private void reapplyCashConfiguration() {\n',
              '    private void reapplyCashConfiguration() {\n'
              '        if (store.isCashBlocked()) {\n'
              '            cashAdapter.disableCashAcceptance();\n'
              '            return;\n'
              '        }\n',
              'reapply blocked guard'
          )
          runtime_path.write_text(runtime, encoding='utf-8')
          PY
          git diff --check
      - name: Build Android debug APK
        working-directory: GouzhuApp
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Verify failure remains disabled
        run: |
          set -euo pipefail
          grep -F 'saveCommandEnvelope(db, envelope, "pending")' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          test "$(grep -c 'putMeta(db, META_CASH_BLOCKED, "1")' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java)" -eq 2
          grep -F 'putMeta(db, META_CASH_BLOCKED, "0")' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          grep -F 'if (store.isCashBlocked()) {' \
            GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
          git diff --check
      - name: Commit focused follow-up
        run: |
          git rm .github/workflows/finalize-cash-config-failure-disable.yml
          git rm .github/workflows/finalize2-cash-config-failure-disable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
          git commit -m "保持现金配置失败后的禁用状态"
          git push origin HEAD:fix/cash-config-receipt-increment-20260803
