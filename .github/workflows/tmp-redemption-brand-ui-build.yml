name: Temporary Redemption Brand UI Build
on:
  push:
    branches:
      - tmp-redemption-brand-ui-20260824
    paths:
      - '.github/workflows/tmp-redemption-brand-ui-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 应用核销品牌入口UI修改
        run: |
          python3 tools/tmp_apply_redemption_brand_ui.py
          rm -f tools/tmp_apply_redemption_brand_ui.py
          rm -f .github/workflows/tmp-redemption-brand-ui-build.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m '临时应用团购核销品牌入口UI'
          git push origin HEAD:tmp-redemption-brand-ui-20260824
      - name: 单元测试和调试构建
        run: |
          cd GouzhuApp
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug
