name: Bootstrap cash configuration receipt increment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-config-receipt-increment-20260803
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Extract and apply focused patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path(
              '.github/workflows/apply-cash-config-receipt-increment.yml'
          ).read_text(encoding='utf-8')
          marker = '      - name: Apply receipt increment changes\n'
          next_marker = '      - name: Verify SDK factories\n'
          start = workflow.index(marker)
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index(next_marker, run_start)
          lines = workflow[run_start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          Path('/tmp/apply-cash-receipt.sh').write_text(
              script,
              encoding='utf-8'
          )
          PY
          bash /tmp/apply-cash-receipt.sh
      - name: Verify SDK factories
        run: |
          javap -classpath GouzhuApp/app/libs/xiaoda-device-sdk-0.1.0.jar \
            com.pinball.xiaoda.device.sdk.protocol.DeviceCommandResult \
            | grep -E 'configurationAcknowledgement|configurationTerminal'
      - name: Build Android debug APK
        working-directory: GouzhuApp
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Verify focused implementation
        run: |
          python3 <<'PY'
          from pathlib import Path

          decoder = Path('GouzhuApp/app/src/main/java/com/gouzhu/mqtt/SdkCommandDecoder.java').read_text(encoding='utf-8')
          runtime = Path('GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java').read_text(encoding='utf-8')
          store = Path('GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java').read_text(encoding='utf-8')
          for value in (
              'DeviceCommandResult.configurationAcknowledgement(',
              'DeviceCommandResult.configurationTerminal(',
          ):
              if value not in decoder:
                  raise SystemExit(f'decoder missing {value}')
          for value in (
              'commitPendingCashConfigurationAndResult(',
              'persistAndPublishConfigurationFailure(',
              'failInterruptedCashConfiguration()',
          ):
              if value not in runtime:
                  raise SystemExit(f'runtime missing {value}')
          for value in (
              'META_PENDING_CONFIG_FAILURE_PAYLOAD',
              'commitPendingCashConfigurationAndResult(',
              'failCashConfigurationAndResult(',
          ):
              if value not in store:
                  raise SystemExit(f'store missing {value}')
          if '.terminal(0, resultCode, resultMessage)\n                    .configurationVersion' in decoder:
              raise SystemExit('manual configuration terminal still exists')
          PY
          git diff --check
      - name: Commit implementation
        run: |
          git rm .github/workflows/apply-cash-config-receipt-increment.yml
          git rm .github/workflows/bootstrap-cash-config-receipt-increment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/SdkCommandDecoder.java
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/DeviceCommandStore.java
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
          git commit -m "接入现金配置应用回执增量协议"
          git push origin HEAD:fix/cash-config-receipt-increment-20260803
