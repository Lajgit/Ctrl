name: Dump Bootstrap Cash API
on:
  push:
    paths:
      - '.github/workflows/dump-bootstrap-cash-api.yml'
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dump API
        run: |
          JAR=GouzhuApp/app/libs/xiaoda-device-sdk-0.1.0.jar
          mkdir -p docs
          {
            javap -classpath "$JAR" 'com.pinball.xiaoda.device.sdk.client.DeviceAppBootstrapResult'
            javap -classpath "$JAR" 'com.pinball.xiaoda.device.sdk.client.DeviceAppBootstrapResult$CashSaleInfo'
            javap -classpath "$JAR" 'com.pinball.xiaoda.device.sdk.client.DeviceAppBootstrapResult$CashTierInfo'
          } > docs/bootstrap-cash-api.txt
      - name: Commit
        run: |
          rm -f .github/workflows/dump-bootstrap-cash-api.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m '记录首页现金配置SDK接口' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
