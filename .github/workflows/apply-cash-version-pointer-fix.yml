name: Apply cash applied-version pointer fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-config-pb13-20260803
      - name: Keep failed config from becoming the disable version
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one match, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          adapter = "GouzhuApp/app/src/main/java/com/gouzhu/hardware/SerialCashConfigurationAdapter.java"
          replace_once(
              adapter,
              "    private volatile long lastConfigVersion = 1L;",
              "    private volatile long lastAppliedConfigVersion = 1L;"
          )
          replace_once(
              adapter,
              "    @Override\n    public void disableCashAcceptance() {",
              "    public void markApplied(long configVersion) {\n"
              "        if (configVersion > 0L && configVersion <= 0x00FFFFFFL) {\n"
              "            lastAppliedConfigVersion = configVersion;\n"
              "        }\n"
              "    }\n\n"
              "    @Override\n"
              "    public void disableCashAcceptance() {"
          )
          replace_once(
              adapter,
              "        long version = Math.max(1L, Math.min(0x00FFFFFFL, lastConfigVersion));",
              "        long version = Math.max(\n"
              "                1L,\n"
              "                Math.min(0x00FFFFFFL, lastAppliedConfigVersion)\n"
              "        );"
          )
          replace_once(
              adapter,
              "            lastConfigVersion = configVersion;\n",
              ""
          )

          runtime = "GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java"
          replace_once(
              runtime,
              "            if (success) {\n"
              "                resultCode = \"CASH_CONFIGURATION_APPLIED\";",
              "            if (success) {\n"
              "                cashAdapter.markApplied(configVersion);\n"
              "                resultCode = \"CASH_CONFIGURATION_APPLIED\";"
          )
          replace_once(
              runtime,
              "                        safe(result.getMessage())\n"
              "                );\n"
              "            }\n"
              "        });",
              "                        safe(result.getMessage())\n"
              "                );\n"
              "            } else {\n"
              "                cashAdapter.markApplied(record.configVersion);\n"
              "            }\n"
              "        });"
          )
          PY
          git diff --check
      - name: Commit version pointer fix
        run: |
          git rm .github/workflows/apply-cash-version-pointer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GouzhuApp/app/src/main/java/com/gouzhu/hardware/SerialCashConfigurationAdapter.java
          git add GouzhuApp/app/src/main/java/com/gouzhu/mqtt/PlatformCommandRuntime.java
          git commit -m "避免失败现金配置覆盖成功版本指针"
          git push origin HEAD:fix/cash-config-pb13-20260803